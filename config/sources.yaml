version: 1
language: en
market: PT
policy:
  discovery_is_evidence: false
  official_evidence_required_for_high_risk: true
  community_sources_are_discovery_only: true
  paid_sources_allowed: false
inputs:
  - id: finkavo-corpus
    type: internal_corpus
    enabled: true
    authority: canonical
    notes: Reuse canonical corpus IDs, source versions, and supporting spans.
  - id: portugal-official-web
    type: official_allowlist
    enabled: true
    authority: official
    domains:
      - aima.gov.pt
      - diariodarepublica.pt
      - eportugal.gov.pt
      - gov.pt
      - info.portaldasfinancas.gov.pt
      - portaldasfinancas.gov.pt
      - seg-social.pt
      - irn.justica.gov.pt
      - bportugal.pt
      - sns24.gov.pt
      - ine.pt
    notes: Fetch through the existing corpus freshness path where possible.
  - id: portugal-official-change-monitor
    type: official_page_monitor
    enabled: true
    authority: official
    urls:
      - https://aima.gov.pt/pt/noticias
      - https://www.gov.pt/noticias
      - https://info.portaldasfinancas.gov.pt/pt/apoio_contribuinte/calendario_fiscal/Pages/default.aspx
      - https://info.portaldasfinancas.gov.pt/pt/apoio_ao_contribuinte/Cidadaos/Rendimentos/Declaracao/prazos/Paginas/default.aspx
      - https://info.portaldasfinancas.gov.pt/pt/apoio_ao_contribuinte/Cidadaos/Casa_e_propriedades/Imposto_anual/Paginas/default.aspx
      - https://www.seg-social.pt/trabalhadores-independentes
      - https://diariodarepublica.pt/dr/home
      - https://bpstat.bportugal.pt/conteudos/noticias
    notes: Changes are discovery signals until the exact official URL and current content version exist in the canonical corpus.
  - id: gdelt-portugal
    type: keyless_news_discovery
    enabled: true
    endpoint: https://api.gdeltproject.org/api/v2/doc/doc
    notes: Zero-cost discovery only. The scheduled n8n workflow deduplicates results; never use these records as factual evidence.
  - id: rss-feeds
    type: rss_atom
    enabled: false
    feeds: []
    notes: Populate with verified feeds. Prefer feeds over commercial free-tier news APIs.
